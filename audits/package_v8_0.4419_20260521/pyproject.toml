[project]
name = "tabletennis-timeseries-prediction"
version = "0.1.0"
description = "Table Tennis Tactical & Outcome Prediction"
requires-python = ">=3.11"
# Versions are pinned to a compatible-release range (>=X.Y,<X+1) for reproducibility.
# `uv.lock` resolves exact versions; bump these manually after testing upgrades.
dependencies = [
    # Core
    "numpy>=1.26,<2.3",
    "pandas>=2.2,<2.4",
    "scikit-learn>=1.4,<1.7",
    # AutoML (lightgbm/catboost/xgboost extras = AutoGluon's core tree models)
    # AutoGluon does not guarantee backwards compatibility for saved predictors,
    # so allow only the verified-good range. Bump after re-training models.
    "autogluon.tabular[lightgbm,catboost,xgboost]>=1.5,<1.6",
    # Ray range matches what AutoGluon 1.5.x supports — outside this range
    # AutoGluon's worker init breaks. Do not loosen without testing.
    "ray>=2.43.0,<2.53.0",
    # Evaluation & metrics
    "scipy>=1.13,<1.15",
    # UI
    # streamlit removed `use_container_width` after 2025-12-31; we now use
    # `width="stretch"`. Allow 1.40+ which supports the new API.
    "streamlit>=1.40,<2.0",
    "plotly>=5.22,<7.0",
    # Utilities
    "rich>=13.7,<15.0",
    "tqdm>=4.66,<5.0",
    "joblib>=1.4,<2.0",
]

[project.optional-dependencies]
dev = [
    "ipykernel",
    "jupyter",
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"app/i18n.py" = ["E501"]  # translation strings are inherently long

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = [
    "--cov=src",
    "--cov=app.i18n",
    "--cov=app._utils",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-fail-under=100",
]

[tool.coverage.run]
omit = [
    "src/train.py",          # main() requires full CLI parse; helpers tested separately
    "src/predict.py",        # main() is a thin CLI wrapper; core tested via predict_from_model
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
]
